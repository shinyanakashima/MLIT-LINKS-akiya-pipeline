name: Build dataset

# ビルド時バッチ（docs/03/05）の計算環境。年1更新を見越し、手動＋年次スケジュールで実行。
# 取得→正規化→突合→AI分類→（任意で）GitHub Releases 公開 を1ジョブで行う。
on:
  workflow_dispatch:
    inputs:
      classify:
        description: "STRONG_POINTS をAI分類する"
        type: boolean
        default: true
      provider:
        description: "AIプロバイダ"
        type: choice
        options: [openai, anthropic]
        default: openai
      limit:
        description: "分類件数の上限（試行用。空で全件）"
        type: string
        default: ""
      publish:
        description: "成果物を GitHub Releases に公開する"
        type: boolean
        default: false
      year:
        description: "対象年度（年次更新。空でコード既定）"
        type: string
        default: ""
      registered_url:
        description: "登録物件CSVのURL（年次更新。空でコード既定）"
        type: string
        default: ""
      closed_url:
        description: "成約物件CSVのURL（年次更新。空でコード既定）"
        type: string
        default: ""
      dataset_page:
        description: "出典データセットページURL（年次更新。空でコード既定）"
        type: string
        default: ""
  schedule:
    # 毎年4月5日（年次更新の目安）。スケジュール実行は分類＋公開まで自動で行う。
    - cron: "0 0 5 4 *"

permissions:
  contents: write  # Releases 作成・タグ付けに必要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: メタ情報（年度・スキーマ版・リリースタグ）
        id: meta
        run: |
          YEAR="${{ inputs.year }}"
          if [ -z "$YEAR" ]; then
            YEAR=$(PYTHONPATH=src python -c "from akiya_pipeline import sources; print(sources.DATASET_YEAR)")
          fi
          SV=$(PYTHONPATH=src python -c "import akiya_pipeline; print(akiya_pipeline.SCHEMA_VERSION)")
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "tag=data-$YEAR.$SV" >> "$GITHUB_OUTPUT"

      - name: 取得・正規化・突合
        env:
          # 年次更新の上書き（空ならコード既定が使われる）。
          AKIYA_YEAR: ${{ steps.meta.outputs.year }}
          AKIYA_REGISTERED_URL: ${{ inputs.registered_url }}
          AKIYA_CLOSED_URL: ${{ inputs.closed_url }}
          AKIYA_DATASET_PAGE: ${{ inputs.dataset_page }}
        run: PYTHONPATH=src python -m akiya_pipeline.cli build --fetch --out-dir dist

      # 前年リリースの成果物を取得（差分・タグ引き継ぎ用）。初回は存在しないので best-effort。
      - name: 前年リリース取得（任意）
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prev
          if gh release download --pattern 'akiya-*.json' --dir prev 2>/dev/null; then
            P=$(ls prev/akiya-*.json | head -1)
            echo "path=$P" >> "$GITHUB_OUTPUT"
            echo "year=$(basename "$P" | sed -E 's/.*akiya-([0-9]+)\.json/\1/')" >> "$GITHUB_OUTPUT"
            echo "前年リリース: $P"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "前年リリースなし（初回）"
          fi

      # スケジュール実行（inputs 無し）でも分類するため event 判定を併用。
      - name: AI分類
        if: ${{ github.event_name == 'schedule' || inputs.classify }}
        env:
          # プロバイダに応じて使うキーが切り替わる（未使用側は空でよい）。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
          PREV: ${{ steps.prev.outputs.path }}
        run: |
          python -m pip install --quiet "anthropic>=0.40" "openai>=1.50"
          LIMIT_ARG=""
          if [ -n "${{ inputs.limit }}" ]; then LIMIT_ARG="--limit ${{ inputs.limit }}"; fi
          PREV_ARG=""
          if [ -n "$PREV" ]; then PREV_ARG="--prev $PREV"; fi
          PYTHONPATH=src python -m akiya_pipeline.cli classify \
            --in dist/akiya-${{ steps.meta.outputs.year }}.json \
            --provider "${PROVIDER:-openai}" $LIMIT_ARG $PREV_ARG

      # 前年版がある場合のみ差分を生成（失敗しても本処理は止めない）。
      - name: 年次差分
        if: ${{ steps.prev.outputs.path != '' }}
        continue-on-error: true
        run: |
          PYTHONPATH=src python -m akiya_pipeline.cli diff \
            --prev "${{ steps.prev.outputs.path }}" \
            --curr dist/akiya-${{ steps.meta.outputs.year }}.json \
            --out dist/diff-${{ steps.prev.outputs.year }}-${{ steps.meta.outputs.year }}.json

      - name: 成果物をアップロード（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: akiya-dataset
          path: |
            dist/akiya-${{ steps.meta.outputs.year }}.json
            dist/akiya-${{ steps.meta.outputs.year }}.jsonl
            dist/manifest.json
            dist/diff-*.json

      - name: GitHub Releases に公開
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          YEAR: ${{ steps.meta.outputs.year }}
        run: |
          {
            echo "国交省 Project LINKS 空き家バンク（${YEAR}年度）正規化済みデータ。"
            echo ""
            echo "- ライセンス: CC-BY 4.0（出典表示が必須）"
            echo "- 仕様: docs/07-output-spec.md"
            echo ""
            echo '```json'
            cat dist/manifest.json
            echo '```'
            for f in dist/diff-*.json; do
              [ -e "$f" ] || continue
              echo ""
              echo "前年差分（$(basename "$f")）:"
              echo '```json'
              python -c "import json,sys; print(json.dumps(json.load(open('$f'))['summary'], ensure_ascii=False, indent=2))"
              echo '```'
            done
          } > release-notes.md
          ASSETS="dist/akiya-${YEAR}.json dist/akiya-${YEAR}.jsonl dist/manifest.json schema/akiya-property.schema.json"
          for f in dist/diff-*.json; do [ -e "$f" ] && ASSETS="$ASSETS $f"; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --title "空き家バンク正規化データ ${YEAR}（schema ${TAG#data-${YEAR}.}）" \
              --notes-file release-notes.md
          fi
