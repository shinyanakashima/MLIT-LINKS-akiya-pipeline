name: Build dataset

# ビルド時バッチ（docs/03/05）の計算環境。年1更新を見越し、手動＋年次スケジュールで実行。
# STRONG_POINTS のAI分類は ANTHROPIC_API_KEY（Secrets）を使ってこのジョブ内で実行する。
on:
  workflow_dispatch:
    inputs:
      classify:
        description: "STRONG_POINTS をAI分類する"
        type: boolean
        default: true
      provider:
        description: "AIプロバイダ"
        type: choice
        options: [anthropic, openai]
        default: anthropic
      limit:
        description: "分類件数の上限（試行用。空で全件）"
        type: string
        default: ""
  schedule:
    - cron: "0 0 5 4 *"  # 毎年4月5日（年次更新の目安）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 取得・正規化・突合
        run: PYTHONPATH=src python -m akiya_pipeline.cli build --fetch --out-dir dist

      - name: AI分類（任意）
        if: ${{ inputs.classify }}
        env:
          # プロバイダに応じて使うキーが切り替わる（未使用側は空でよい）。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          python -m pip install --quiet "anthropic>=0.40" "openai>=1.50"
          LIMIT_ARG=""
          if [ -n "${{ inputs.limit }}" ]; then LIMIT_ARG="--limit ${{ inputs.limit }}"; fi
          PYTHONPATH=src python -m akiya_pipeline.cli classify \
            --in dist/akiya-2025.json --provider "${PROVIDER:-anthropic}" $LIMIT_ARG

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: akiya-dataset
          path: |
            dist/akiya-2025.json
            dist/akiya-2025.jsonl
            dist/manifest.json
